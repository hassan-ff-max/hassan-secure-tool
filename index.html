      { id: 25, name: "KB to MB Converter", desc: "Storage size unit converter.", icon: "fa-hard-drive", html: `<div class="flex gap-2"><input type="number" id="t25" placeholder="KB" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(25)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">MB</button></div>` },
      { id: 26, name: "MB to GB Converter", desc: "Storage size unit converter.", icon: "fa-database", html: `<div class="flex gap-2"><input type="number" id="t26" placeholder="MB" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(26)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">GB</button></div>` },
      { id: 27, name: "Speed Calculator (KM/H to M/S)", desc: "Velocity unit converter.", icon: "fa-gauge", html: `<div class="flex gap-2"><input type="number" id="t27" placeholder="KM/H" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(27)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">M/S</button></div>` },
      { id: 28, name: "Random Hex Color", desc: "Generate random glowing color code.", icon: "fa-brush", html: `<button onclick="runTool(28)" class="w-full py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Generate Hex Code</button><div id="t28_out" class="text-[11px] font-mono text-center theme-text mt-1">#------</div>` },
      { id: 29, name: "Text Repeater", desc: "Repeat text multiple times instantly.", icon: "fa-repeat", html: `<div class="flex gap-2"><input type="text" id="t29_txt" placeholder="Word" class="w-3/5 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><input type="number" id="t29_num" placeholder="Times" class="w-2/5 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(29)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Go</button></div>` },
      { id: 30, name: "Whitespace Remover", desc: "Trim extra spaces from text string.", icon: "fa-scissors", html: `<div class="flex gap-2"><input type="text" id="t30" placeholder="Text with spaces..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(30)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Trim</button></div>` },
      { id: 31, name: "UUID v4 Generator", desc: "Generate unique random UUID string.", icon: "fa-id-badge", html: `<button onclick="runTool(31)" class="w-full py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Generate UUID</button><div id="t31_out" class="text-[10px] font-mono text-slate-400 mt-1 truncate"></div>` },
      { id: 32, name: "Leap Year Checker", desc: "Check if a year is a leap year.", icon: "fa-calendar-days", html: `<div class="flex gap-2"><input type="number" id="t32" placeholder="Year (e.g. 2026)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(32)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Check</button></div>` },
      { id: 33, name: "Text to ASCII", desc: "Convert character to ASCII code.", icon: "fa-terminal", html: `<div class="flex gap-2"><input type="text" maxlength="1" id="t33" placeholder="Char" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(33)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">ASCII</button></div>` },
      { id: 34, name: "Discount Percentage Calc", desc: "Calculate final price after discount.", icon: "fa-percent", html: `<div class="flex gap-2"><input type="number" id="t34_p" placeholder="Price" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><input type="number" id="t34_d" placeholder="Disc %" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(34)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Calc</button></div>` },
      { id: 35, name: "Square Root Calculator", desc: "Calculate square root of any number.", icon: "fa-square-root-variable", html: `<div class="flex gap-2"><input type="number" id="t35" placeholder="Number" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(35)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Sqrt</button></div>` },
      { id: 36, name: "Roman Numeral Converter", desc: "Convert numbers up to 100 to Roman.", icon: "fa-list-ol", html: `<div class="flex gap-2"><input type="number" min="1" max="100" id="t36" placeholder="1-100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(36)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Roman</button></div>` },
      { id: 37, name: "IP Address Mockup", desc: "Generate secure dummy IPv4 address.", icon: "fa-network-wired", html: `<button onclick="runTool(37)" class="w-full py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Generate Fake IP</button><div id="t37_out" class="text-[11px] font-mono text-center theme-text mt-1">0.0.0.0</div>` },
      { id: 38, name: "Email Masker", desc: "Hide email username for privacy.", icon: "fa-user-secret", html: `<div class="flex gap-2"><input type="email" id="t38" placeholder="hassan@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(38)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Mask</button></div>` },
      { id: 39, name: "Ping Simulation Tool", desc: "Simulate server latency check.", icon: "fa-signal", html: `<button onclick="runTool(39)" class="w-full py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Test Server Ping</button><div id="t39_out" class="text-[11px] font-mono text-center theme-text mt-1">Status: Ready</div>` },
      { id: 40, name: "System Device Info", desc: "Check current browser & screen resolution.", icon: "fa-laptop-code", html: `<button onclick="runTool(40)" class="w-full py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Show Specs</button><div id="t40_out" class="text-[10px] font-mono text-slate-300 mt-1 truncate">Click to view specs</div>` },
      { id: 41, name: "Matrix Code Rain Text", desc: "Generate cyber hacker style text.", icon: "fa-terminal", html: `<div class="flex gap-2"><input type="text" id="t41" placeholder="Hassan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-200"><button onclick="runTool(41)" class="px-3 py-1.5 theme-bg text-slate-950 font-bold rounded-lg text-xs">Cyber</button></div>` }
    ];

    function renderTools(list) {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';
      if(list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 text-xs">No tools found matching your search.</div>`;
        return;
      }
      list.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'glass p-4 rounded-2xl border theme-border space-y-3 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <h3 class="font-bold text-xs text-white flex items-center gap-2">
                <i class="fa-solid ${tool.icon} theme-text"></i> ${tool.name}
              </h3>
              <span class="px-1.5 py-0.5 text-[9px] bg-indigo-500/20 text-indigo-400 rounded">#${tool.id}</span>
            </div>
            <p class="text-[11px] text-slate-400 mb-2">${tool.desc}</p>
          </div>
          <div>${tool.html}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterTools() {
      const query = document.getElementById('toolSearch').value.toLowerCase();
      const filtered = toolsData.filter(t => t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query));
      renderTools(filtered);
    }

    // Tool Logic Actions Router
    function runTool(id) {
      if(id === 1) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
        let p = ""; for(let i=0; i<14; i++) p += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('t1').value = p;
      } else if(id === 2) {
        let v = document.getElementById('t2').value; if(v) document.getElementById('t2').value = btoa(v);
      } else if(id === 3) {
        let v = document.getElementById('t3').value; try { document.getElementById('t3').value = atob(v); } catch(e){ alert('Invalid Base64'); }
      } else if(id === 4) {
        let v = document.getElementById('t4').value; if(v) document.getElementById('t4').value = encodeURIComponent(v);
      } else if(id === 5) {
        let v = document.getElementById('t5').value; if(v) document.getElementById('t5').value = decodeURIComponent(v);
      } else if(id === 6) {
        let v = document.getElementById('t6').value.trim();
        let words = v === '' ? 0 : v.split(/\s+/).length;
        let chars = v.length;
        document.getElementById('t6_out').innerText = `Words: ${words} | Chars: ${chars}`;
      } else if(id === 7) {
        let v = document.getElementById('t7').value; if(v) document.getElementById('t7').value = v.toUpperCase();
      } else if(id === 8) {
        let v = document.getElementById('t8').value; if(v) document.getElementById('t8').value = v.toLowerCase();
      } else if(id === 9) {
        let v = document.getElementById('t9').value;
        if(v) document.getElementById('t9_out').innerText = "Hash: " + btoa(v).substring(0, 16) + "a79b";
      } else if(id === 10) {
        let min = parseInt(document.getElementById('t10_min').value) || 0;
        let max = parseInt(document.getElementById('t10_max').value) || 100;
        let res = Math.floor(Math.random() * (max - min + 1)) + min;
        document.getElementById('t10_out').innerText = `Result: ${res}`;
      } else if(id === 11) {
        let c = document.getElementById('t11').value;
        document.getElementById('t11_out').innerText = c;
      } else if(id === 12) {
        let v = document.getElementById('t12').value;
        if(v) document.getElementById('t12').value = v.split('').map(char => char.charCodeAt(0).toString(2)).join(' ');
      } else if(id === 13) {
        document.getElementById('t13_out').innerText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor.";
      } else if(id === 14) {
        let v = document.getElementById('t14').value;
        try { JSON.parse(v); alert('Valid JSON syntax!'); } catch(e){ alert('Invalid JSON syntax!'); }
      } else if(id === 15) {
        let v = document.getElementById('t15').value; if(v) document.getElementById('t15').value = v.split('').reverse().join('');
      } else if(id === 16) {
        let v = document.getElementById('t16').value; if(v) document.getElementById('t16').value = v.toLowerCase().replace(/[^a-z0-9]/g, '-');
      } else if(id === 17) {
        let v = document.getElementById('t17').value; if(v) alert('QR Payload generated for: ' + v);
      } else if(id === 18) {
        let v = document.getElementById('t18').value; if(v) document.getElementById('t18').value = v.replace(/<[^>]*>?/gm, '');
      } else if(id === 19) {
        let y = parseInt(document.getElementById('t19').value);
        if(y) alert(`Approximate age: ${2026 - y} years old.`);
      } else if(id === 20) {
        let t = parseInt(document.getElementById('t20').value);
        if(t) alert(new Date(t * 1000).toUTCString()); else document.getElementById('t20').value = Math.floor(Date.now()/1000);
      } else if(id === 21) {
        let v = document.getElementById('t21').value;
        if(v) document.getElementById('t21').value = v.split(',').map(s=>s.trim()).sort().join(', ');
      } else if(id === 22) {
        let v = document.getElementById('t22').value;
        if(v) document.getElementById('t22').value = [...new Set(v.split(',').map(s=>s.trim()))].join(', ');
      } else if(id === 23) {
        let c = parseFloat(document.getElementById('t23').value);
        if(!isNaN(c)) alert(`${c}°C = ${(c * 9/5 + 32).toFixed(1)}°F`);
      } else if(id === 24) {
        let f = parseFloat(document.getElementById('t24').value);
        if(!isNaN(f)) alert(`${f}°F = ${((f - 32) * 5/9).toFixed(1)}°C`);
      } else if(id === 25) {
        let kb = parseFloat(document.getElementById('t25').value);
        if(!isNaN(kb)) alert(`${kb} KB = ${(kb / 1024).toFixed(3)} MB`);
      } else if(id === 26) {
        let mb = parseFloat(document.getElementById('t26').value);
        if(!isNaN(mb)) alert(`${mb} MB = ${(mb / 1024).toFixed(3)} GB`);
      } else if(id === 27) {
        let km = parseFloat(document.getElementById('t27').value);
        if(!isNaN(km)) alert(`${km} KM/H = ${(km / 3.6).toFixed(2)} M/S`);
      } else if(id === 28) {
        let hex = '#' + Math.floor(Math.random()*16777215).toString(16);
        document.getElementById('t28_out').innerText = hex;
      } else if(id === 29) {
        let txt = document.getElementById('t29_txt').value;
        let num = parseInt(document.getElementById('t29_num').value) || 1;
        if(txt) alert(txt.repeat(num));
      } else if(id === 30) {
        let v = document.getElementById('t30').value; if(v) document.getElementById('t30').value = v.replace(/\s+/g, ' ').trim();
      } else if(id === 31) {
        let uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          let r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        document.getElementById('t31_out').innerText = uuid;
      } else if(id === 32) {
        let yr = parseInt(document.getElementById('t32').value);
        if(yr) alert((yr % 4 === 0 && yr % 100 !== 0) || (yr % 400 === 0) ? `${yr} is a Leap Year!` : `${yr} is NOT a Leap Year.`);
      } else if(id === 33) {
        let ch = document.getElementById('t33').value;
        if(ch) alert(`ASCII Code: ${ch.charCodeAt(0)}`);
      } else if(id === 34) {
        let p = parseFloat(document.getElementById('t34_p').value);
        let d = parseFloat(document.getElementById('t34_d').value);
        if(!isNaN(p) && !isNaN(d)) alert(`Final Price: ${p - (p * d / 100)}`);
      } else if(id === 35) {
        let n = parseFloat(document.getElementById('t35').value);
        if(!isNaN(n)) alert(`Square Root: ${Math.sqrt(n)}`);
      } else if(id === 36) {
        let num = parseInt(document.getElementById('t36').value);
        const rom = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
        if(num >= 1 && num <= 10) alert(`Roman: ${rom[num]}`); else alert('Enter number between 1 and 10');
      } else if(id === 37) {
        let ip = `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        document.getElementById('t37_out').innerText = ip;
      } else if(id === 38) {
        let em = document.getElementById('t38').value;
        if(em.includes('@')) { let parts = em.split('@'); document.getElementById('t38').value = parts[0][0 + '***@' + parts[1]]; }
      } else if(id === 39) {
        let ping = Math.floor(Math.random() * 40) + 12;
        document.getElementById('t39_out').innerText = `Server Latency: ${ping}ms (Stable)`;
      } else if(id === 40) {
        document.getElementById('t40_out').innerText = `${navigator.platform} | ${window.innerWidth}x${window.innerHeight}px`;
      } else if(id === 41) {
        let v = document.getElementById('t41').value;
        if(v) document.getElementById('t41').value = `[ █ █ ${v} █ █ ]`;
      }
    }

    // Initial render
    renderTools(toolsData);
  </script>
</body>
</html>
